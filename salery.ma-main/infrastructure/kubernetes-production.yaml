# SALERY.MA V15 - ULTIMATE PRODUCTION ORCHESTRATION
# Architecture: Multi-tenant Microservices / Zero-Trust / Sovereign Cloud

apiVersion: v1
kind: Namespace
metadata:
  name: salery-prod
  labels:
    tier: enterprise
    security: zero-trust
    region: ma-central-1
---
# 1. RESOURCE QUOTAS (Tenant Protection)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: salery-prod
spec:
  hard:
    pods: "50"
    requests.cpu: "10"
    requests.memory: "20Gi"
    limits.cpu: "20"
    limits.memory: "40Gi"
---
# 2. ZERO-TRUST NETWORK POLICIES
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-internal-traffic
  namespace: salery-prod
spec:
  podSelector:
    matchLabels:
      app: payroll-engine
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api-gateway # Only allow requests from Gateway
---
# 3. API GATEWAY DEPLOYMENT (V15)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: salery-api-gateway
  namespace: salery-prod
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - api-gateway
            topologyKey: "kubernetes.io/hostname"
      containers:
      - name: gateway
        image: salery/api-gateway:v15.2.1-stable
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          limits:
            cpu: "1000m"
            memory: "2Gi"
          requests:
            cpu: "500m"
            memory: "1Gi"
        env:
        - name: NODE_ENV
          value: "production"
        - name: Sovereign_Cloud_ID
          value: "MA-KMS-001"
---
# 4. PAYROLL WORKER ENGINE (V15 SUPREME)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: salery-payroll-worker
  namespace: salery-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payroll-engine
  template:
    metadata:
      labels:
        app: payroll-engine
    spec:
      containers:
      - name: worker
        image: salery/payroll-engine:v15.0.0-dist
        resources:
          limits:
            cpu: "2000m"
            memory: "4Gi"
          requests:
            cpu: "1000m"
            memory: "2Gi"
        env:
        - name: WORKER_CONCURRENCY
          value: "20"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-prod-cluster:9092"
---
# 5. AUTO-SCALING (HPA)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: salery-gateway-hpa
  namespace: salery-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: salery-api-gateway
  minReplicas: 4
  maxReplicas: 12
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
---
# 6. EXPOSURE (LoadBalancer Service)
apiVersion: v1
kind: Service
metadata:
  name: salery-ingress-lb
  namespace: salery-prod
  annotations:
    service.beta.kubernetes.io/ma-cloud-load-balancer-internal: "false"
spec:
  type: LoadBalancer
  ports:
  - port: 443
    targetPort: 8080
    protocol: TCP
  selector:
    app: api-gateway
