apiVersion: apps/v1
kind: Deployment
metadata:
  name: salery-gov-node
  namespace: salery-prod
  labels:
    app: gov-node
    tier: national-compliance
spec:
  replicas: 2
  strategy:
    type: Recreate # Mandatory for stateful gov-key handshake
  selector:
    matchLabels:
      app: gov-node
  template:
    metadata:
      labels:
        app: gov-node
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: gov-node-agent
        image: salery/gov-node-v19:latest
        ports:
        - containerPort: 9000
        env:
        - name: SOVEREIGN_REGION
          value: "MA-CENTRAL-1"
        - name: PKI_ENDPOINT
          value: "https://pki.gov.ma/api/v1"
        - name: AI_ORCHESTRATOR
          value: "gemini-3-pro-preview"
        resources:
          limits:
            cpu: "2000m"
            memory: "2Gi"
          requests:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health/sovereign
            port: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: salery-gov-svc
  namespace: salery-prod
spec:
  selector:
    app: gov-node
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gov-node-isolation
  namespace: salery-prod
spec:
  podSelector:
    matchLabels:
      app: gov-node
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api-gateway
  egress:
  - to:
    - ipBlock:
        cidr: 10.0.0.0/8 # Only allow internal national pki network
