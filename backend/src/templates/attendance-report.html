<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Rapport de Présence</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        @page {
            size: A4;
            margin: 15mm;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            color: #000;
            font-size: 9px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid #000;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .company-name {
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .doc-title {
            font-size: 20px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .emp-info {
            border: 1px solid #000;
            padding: 10px;
            margin-bottom: 20px;
            display: inline-block;
            min-width: 50%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th,
        td {
            border: 1px solid #000;
            padding: 6px;
            text-align: center;
        }

        th {
            background-color: #f4f4f4;
            text-transform: uppercase;
            font-size: 8px;
            font-weight: 800;
        }

        td:first-child,
        th:first-child {
            text-align: left;
        }

        .totals-row td {
            font-weight: 800;
            background-color: #f4f4f4;
        }

        .status-badge {
            font-weight: 800;
            text-transform: uppercase;
            font-size: 8px;
        }

        .footer {
            margin-top: 30px;
            font-size: 9px;
            text-align: right;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="header">
        <div>
            <div class="company-name">{{companyName}}</div>
            <div style="font-size: 10px; margin-top: 4px;">Rapport de Présence - {{periode}}</div>
        </div>
        <div class="doc-title">Relevé de Pointage Mensuel</div>
    </div>

    <div class="emp-info">
        <div style="margin-bottom: 5px;"><strong>Salarié :</strong> {{empName}} ({{empMatricule}})</div>
        <div><strong>Site :</strong> {{empSite}} | <strong>Fonction :</strong> {{empPosition}}</div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Type</th>
                <th>Heure Arrivée</th>
                <th>Heure Départ</th>
                <th>Heures Réalisées</th>
                <th>Heures Supp.</th>
                <th>Statut</th>
            </tr>
        </thead>
        <tbody>
            {{dynamicTableRows}}
        </tbody>
        <tfoot>
            {{dynamicTotalsRow}}
        </tfoot>
    </table>

    <div class="footer">
        Visa Manager
    </div>
</body>

</html>
