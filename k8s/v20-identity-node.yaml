apiVersion: apps/v1
kind: Deployment
metadata:
  name: salery-identity-node
  namespace: salery-prod
  labels:
    app: identity-node
    tier: sovereign-auth
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: identity-node
  template:
    metadata:
      labels:
        app: identity-node
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: identity-engine
        image: salery/identity-node-v20:latest
        ports:
        - containerPort: 9100
        env:
        - name: HSM_ENABLED
          value: "true"
        - name: IDENTITY_SALT
          value: "MA-SVRGN-V20-FIXED"
        - name: GRAPH_DB_URL
          value: "bolt://identity-graph-svc:7687"
        resources:
          limits:
            cpu: "1000m"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health/trust
            port: 9100
---
apiVersion: v1
kind: Service
metadata:
  name: identity-graph-svc
  namespace: salery-prod
spec:
  selector:
    app: identity-node
  ports:
    - protocol: TCP
      port: 7687
      targetPort: 9100
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: identity-isolation
  namespace: salery-prod
spec:
  podSelector:
    matchLabels:
      app: identity-node
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: gov-node # Gov Node needs identity sync
    - podSelector:
        matchLabels:
          app: api-gateway
